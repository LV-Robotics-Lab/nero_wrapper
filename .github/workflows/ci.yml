name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests examples/nero_read_state.py
      - run: pytest
      - run: python -m compileall -q src examples scripts
      - run: bash -n config/nero.env setup.sh scripts/*.sh docker/humble/entrypoint.sh
